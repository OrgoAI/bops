name: Release

# Each version of the Mac app is a GitHub release. Pushing a tag "v<version>" (the version in
# package.json) builds Bops on a GitHub Mac, signs it with the Developer ID certificate, has Apple
# notarize it (electron-builder staples the ticket), checks Gatekeeper accepts it, and attaches the
# DMG and zip to the release of that tag. A tag with a hyphen (v0.2.0-beta.1) makes a pre-release.
#
# Secrets (repository settings): MAC_CERT_P12_BASE64 and MAC_CERT_PASSWORD (the Developer ID
# Application certificate with its key, exported as .p12), APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and
# APPLE_TEAM_ID (notarization), and ORGO_RELAY_TOKEN (read access to orgoai/orgo-relay's releases,
# for the relay agent the app bundles). Without them the job stops before building.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Secrets are set
        env:
          HAVE: ${{ secrets.MAC_CERT_P12_BASE64 != '' && secrets.MAC_CERT_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' && secrets.ORGO_RELAY_TOKEN != '' }}
        run: |
          [ "$HAVE" = true ] || { echo "::error::Release secrets aren't all set (see the comment at the top of release.yml)."; exit 1; }

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: The tag matches package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$want" ] || { echo "::error::Tag $TAG doesn't match package.json ($want)."; exit 1; }

      - run: npm ci

      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # scripts/fetch-relay.sh downloads the relay agent from orgoai/orgo-relay's releases.
          GH_TOKEN: ${{ secrets.ORGO_RELAY_TOKEN }}
        run: scripts/release.sh --publish never

      - name: Notarized and accepted by Gatekeeper
        run: |
          app=dist-desktop/mac-arm64/Bops.app
          xcrun stapler validate "$app"
          spctl -a -vv -t exec "$app"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist-desktop/*.dmg dist-desktop/*.zip dist-desktop/*.blockmap dist-desktop/latest-mac.yml)
          [ ${#files[@]} -gt 0 ] || { echo "::error::No DMG or zip was built."; exit 1; }
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          # The notes: what's new in this version (docs/releases/<tag>.md, a few "- " lines), then the line
          # every release has. A tag from before those files gets the line alone, and an existing release
          # of one keeps its notes.
          whatsnew="docs/releases/$TAG.md"
          notes="$RUNNER_TEMP/notes.md"
          {
            if [ -f "$whatsnew" ]; then
              tr -d '\r' < "$whatsnew" | grep -E '^- ' || true
              echo
            fi
            echo "Bops for Mac (Apple silicon), signed with Developer ID and notarized by Apple."
          } > "$notes"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" $pre --verify-tag --title "Bops $TAG" --notes-file "$notes"
          elif [ -f "$whatsnew" ]; then
            gh release edit "$TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
