name: CI

on:
  push:
  pull_request:

# Read-only: CI checks the code and never writes to the repo.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The Electron binary isn't needed to typecheck and lint.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      # Actions and the scanner image pinned to exact versions, so a moved tag can't change what runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Route types (next-env.d.ts isn't committed)
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Typecheck Bops Cloud
        run: npx tsc -p cloud/tsconfig.json --noEmit
      - name: Lint
        run: npm run lint
      - name: Secret scan (whole history)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --log-opts="--all"
