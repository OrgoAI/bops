# bops.bot, the landing page (site/). Deploy: cd site && fly deploy
app = "bops-site"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
