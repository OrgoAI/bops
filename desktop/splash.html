<!doctype html>
<!--
  What the Bops window shows while its server starts: Boppy (lib/mascot.ts, the main bot awake, as on
  bops.bot) listening to music, bopping to the beat while notes drift out of its headphones, singing
  along, its eyes glancing about and blinking now and then. CSS only, transform and opacity only, and
  still with reduced motion.
  components/app/mascot.tsx (BoppyLoading) draws the same scene for the app's own first load, so one
  hands over to the other without a jump.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bops</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font: 13px/1.5 -apple-system, system-ui, sans-serif; color: #6B6B6B; -webkit-app-region: drag; user-select: none; }
  .scene { position: relative; width: 88px; height: 96px; }
  .boppy { position: absolute; left: 0; top: 0; width: 88px; height: 88px; transform-origin: 50% 90%; animation: bop 1.1s ease-in-out infinite; }
  .shadow { position: absolute; left: 22px; bottom: 0; width: 44px; height: 6px; border-radius: 50%; background: #0A0A0A; opacity: 0.08; animation: shadow 0.55s ease-in-out infinite; }
  .note { position: absolute; top: 34px; width: 14px; height: 14px; opacity: 0; animation-duration: 2.2s; animation-timing-function: cubic-bezier(.2,.6,.35,1); animation-iteration-count: infinite; }
  .note.l { left: 4px; animation-name: note-l; }
  .note.r { right: 4px; animation-name: note-r; }
  .note:nth-of-type(2) { animation-delay: 0.55s; }
  .note:nth-of-type(3) { animation-delay: 1.1s; }
  .note:nth-of-type(4) { animation-delay: 1.65s; }
  /* Two beats a bar: down on each beat, leaning one way then the other. */
  @keyframes bop {
    0%, 100% { transform: translateY(-3px) rotate(-5deg); }
    25% { transform: translateY(3px) rotate(0deg) scale(1.04, 0.95); }
    50% { transform: translateY(-3px) rotate(5deg); }
    75% { transform: translateY(3px) rotate(0deg) scale(1.04, 0.95); }
  }
  @keyframes shadow { 0%, 100% { transform: scaleX(0.85); opacity: 0.06; } 50% { transform: scaleX(1.05); opacity: 0.1; } }
  @keyframes note-l {
    0% { transform: translate(0, 0) rotate(0deg) scale(0.5); opacity: 0; }
    20% { opacity: 1; transform: translate(-8px, -10px) rotate(-6deg) scale(1); }
    70% { opacity: 0.9; }
    100% { transform: translate(-24px, -46px) rotate(-18deg) scale(0.85); opacity: 0; }
  }
  @keyframes note-r {
    0% { transform: translate(0, 0) rotate(0deg) scale(0.5); opacity: 0; }
    20% { opacity: 1; transform: translate(8px, -10px) rotate(6deg) scale(1); }
    70% { opacity: 0.9; }
    100% { transform: translate(24px, -46px) rotate(18deg) scale(0.85); opacity: 0; }
  }
  /* It sings along, a phrase over four bars: its mouth, shut between lines, opens on the beats, a held note
     wavering. Its eyes go with the song: looking up as the awake face does, over to the left, squeezed shut
     on the first held note, across to the right (only a little: further, the right eye slips under its cup),
     at you, then up, dreamy, on the last note. They blink now and then too, twice sometimes. The eyes and
     mouth are the awake face's, found by their shapes, since the pictures carry no classes
     (scripts/test-bot-moods.mjs holds them to it). Each look keeps the eyes' own translate(.6 -1.4), which
     a CSS transform replaces. */
  .boppy g[transform="translate(.6 -1.4)"] { transform-box: fill-box; transform-origin: center; animation: look 4.4s ease-in-out infinite; }
  .boppy g[transform="translate(.6 -1.4)"] ellipse { transform-box: fill-box; transform-origin: center; animation: blink 5.3s ease-in-out infinite; }
  .boppy ellipse[cy="26.6"] { transform-box: fill-box; transform-origin: center; animation: sing 4.4s ease-in-out infinite; }
  @keyframes sing {
    0%, 2%, 47%, 52%, 96%, 100% { transform: scale(1.2, 0.3); }
    6% { transform: scale(1, 1.15); }
    12%, 25% { transform: scale(1.1, 0.5); }
    18% { transform: scale(1.05, 1.35); }
    31%, 39% { transform: scale(0.95, 1.1); }
    35%, 43% { transform: scale(0.95, 0.9); }
    56% { transform: scale(1.05, 1.25); }
    62% { transform: scale(1.1, 0.45); }
    68% { transform: scale(1.1, 1.4); }
    74% { transform: scale(1.1, 0.5); }
    81%, 91% { transform: scale(1, 1.2); }
    86% { transform: scale(1, 1); }
  }
  @keyframes look {
    0%, 10%, 96%, 100% { transform: translate(0.6px, -1.4px); }
    15%, 24% { transform: translate(-0.6px, -1.1px); }
    29%, 41% { transform: translate(0.6px, -1.6px) scaleY(0.3); }
    46% { transform: translate(0.6px, -1.4px); }
    52%, 66% { transform: translate(1.1px, -1.2px); }
    72%, 78% { transform: translate(0.1px, -0.4px); }
    83%, 90% { transform: translate(0.6px, -2.2px); }
  }
  @keyframes blink {
    0%, 38%, 43%, 82%, 86.5%, 91.5%, 100% { transform: scaleY(1); }
    40%, 84%, 88.5% { transform: scaleY(0.1); }
  }
  /* Still with reduced motion: the face's own selectors, since a plainer one loses to them however late it comes. */
  @media (prefers-reduced-motion: reduce) { .boppy, .shadow, .boppy g[transform="translate(.6 -1.4)"], .boppy g[transform="translate(.6 -1.4)"] ellipse, .boppy ellipse[cy="26.6"] { animation: none; } .note { display: none; } }
</style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="shadow"></div>
    <svg class="note l" viewBox="0 0 24 24"><g fill="#0A0A0A"><ellipse cx="7" cy="17.5" rx="3.3" ry="2.5" transform="rotate(-20 7 17.5)"/><rect x="9.4" y="4" width="1.8" height="13.6" rx=".9"/><path d="M11.2 4c0 3.2 4.8 3.8 4.8 7.6-.9-1.7-2.7-2.4-4.8-2.7z"/></g></svg>
    <svg class="note r" viewBox="0 0 24 24"><g fill="#0A0A0A"><ellipse cx="6" cy="18.3" rx="3" ry="2.3" transform="rotate(-20 6 18.3)"/><ellipse cx="17.6" cy="16.3" rx="3" ry="2.3" transform="rotate(-20 17.6 16.3)"/><rect x="8.1" y="6.2" width="1.7" height="12" rx=".85"/><rect x="19.7" y="4.2" width="1.7" height="12" rx=".85"/><path d="M8.1 6.2 21.4 3.6v2.9L8.1 9.1z"/></g></svg>
    <svg class="note l" viewBox="0 0 24 24"><g fill="#0A0A0A"><ellipse cx="6" cy="18.3" rx="3" ry="2.3" transform="rotate(-20 6 18.3)"/><ellipse cx="17.6" cy="16.3" rx="3" ry="2.3" transform="rotate(-20 17.6 16.3)"/><rect x="8.1" y="6.2" width="1.7" height="12" rx=".85"/><rect x="19.7" y="4.2" width="1.7" height="12" rx=".85"/><path d="M8.1 6.2 21.4 3.6v2.9L8.1 9.1z"/></g></svg>
    <svg class="note r" viewBox="0 0 24 24"><g fill="#0A0A0A"><ellipse cx="7" cy="17.5" rx="3.3" ry="2.5" transform="rotate(-20 7 17.5)"/><rect x="9.4" y="4" width="1.8" height="13.6" rx=".9"/><path d="M11.2 4c0 3.2 4.8 3.8 4.8 7.6-.9-1.7-2.7-2.4-4.8-2.7z"/></g></svg>
    <svg class="boppy" viewBox="0 0 40 40"><g transform="translate(20 21.4) scale(.92) translate(-20 -20)"><g transform="rotate(-9 20 20)"><path d="M5.3 17.6C4.4 8.4 11.1 2 20 2s15.6 6.4 14.7 15.6" fill="none" stroke="#0A0A0A" stroke-width="4.4" stroke-linecap="round"/><path d="M5.3 17.6C4.4 8.4 11.1 2 20 2s15.6 6.4 14.7 15.6" fill="none" stroke="#E9FF3B" stroke-width="2.8" stroke-linecap="round"/><path d="M20 6c8.5 0 14 6 14 13.5S28.5 34 20 34 6 27 6 19.5 11.5 6 20 6z" fill="#0A0A0A"/><g transform="translate(.6 -1.4)"><ellipse cx="15.5" cy="20" rx="2.2" ry="2.9" fill="#fff"/><ellipse cx="24.5" cy="20" rx="2.2" ry="2.9" fill="#fff"/></g><ellipse cx="20.8" cy="26.6" rx="1.35" ry="1.65" fill="#fff"/><rect x="4" y="16" width="7" height="11" rx="3.5" fill="#E9FF3B" stroke="#0A0A0A" stroke-width="1.8"/><rect x="29" y="16" width="7" height="11" rx="3.5" fill="#E9FF3B" stroke="#0A0A0A" stroke-width="1.8"/></g></g></svg>
  </div>
  <div>Starting Bops…</div>
</body>
</html>
